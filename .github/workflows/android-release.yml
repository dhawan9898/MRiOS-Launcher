# Builds a signed release APK and publishes it on the GitHub Releases page.
#
# Trigger it by pushing a version tag:   git tag v3.1 && git push origin v3.1
# or from Actions → "Release APK" → Run workflow, entering a tag such as v3.1.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   MRIOS_KEYSTORE_BASE64    base64 of the release .jks keystore
#   MRIOS_KEYSTORE_PASSWORD  keystore password
#   MRIOS_KEY_ALIAS          key alias
#   MRIOS_KEY_PASSWORD       key password
name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v3.1). Created on the selected branch if it doesn't exist."
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::Tag '$TAG' must look like v3, v3.1 or v3.1.2"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          # Always increasing, so phones accept each release as an update.
          echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MRIOS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret MRIOS_KEYSTORE_BASE64 is not set. Releases must be signed with a fixed key, or phones won't install updates."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "MRIOS_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        env:
          MRIOS_KEYSTORE_PASSWORD: ${{ secrets.MRIOS_KEYSTORE_PASSWORD }}
          MRIOS_KEY_ALIAS: ${{ secrets.MRIOS_KEY_ALIAS }}
          MRIOS_KEY_PASSWORD: ${{ secrets.MRIOS_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PappVersionName="$VERSION_NAME" -PappVersionCode="$VERSION_CODE"

      - name: Verify signature and prepare files
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p "$RUNNER_TEMP/dist"
          APK="$RUNNER_TEMP/dist/MRiOS-Launcher-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          (cd "$RUNNER_TEMP/dist" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/dist"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" ./* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" ./* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MRiOS Launcher $TAG" \
              --generate-notes
          fi
