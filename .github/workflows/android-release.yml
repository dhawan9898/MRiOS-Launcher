# Builds a signed release APK and publishes it on the GitHub Releases page.
#
# - Every push to main that changes the app (android/** or this workflow) releases the next
#   version automatically: v1.0 -> v1.1 -> v1.2 ... (put "[skip release]" in the commit message to skip).
# - Pushing a tag like v2.0 releases exactly that version (use it to bump the major number).
# - Actions → "Release APK" → Run workflow: leave the tag empty for the next version, or enter one.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   MRIOS_KEYSTORE_BASE64    base64 of the release .jks keystore
#   MRIOS_KEYSTORE_PASSWORD  keystore password
#   MRIOS_KEY_ALIAS          key alias
#   MRIOS_KEY_PASSWORD       key password
name: Release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["android/**", ".github/workflows/android-release.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v2.0). Leave empty to release the next version automatically."
        required: false

permissions:
  contents: write

# One release at a time, so version numbers are never handed out twice.
concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need all tags to work out the next version

      - name: Resolve version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            # Next minor version after the newest vX.Y tag (v1.0 -> v1.1). Starts at v1.0.
            LATEST=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+$' | head -n1)
            if [ -z "$LATEST" ]; then
              TAG="v1.0"
            else
              MAJOR=$(echo "${LATEST#v}" | cut -d. -f1)
              MINOR=$(echo "${LATEST#v}" | cut -d. -f2)
              TAG="v${MAJOR}.$((MINOR + 1))"
            fi
            echo "Latest release tag: ${LATEST:-none} -> releasing $TAG"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::Tag '$TAG' must look like v3, v3.1 or v3.1.2"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          # Always increasing, so phones accept each release as an update.
          echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MRIOS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret MRIOS_KEYSTORE_BASE64 is not set. Releases must be signed with a fixed key, or phones won't install updates."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "MRIOS_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build signed release APK
        env:
          MRIOS_KEYSTORE_PASSWORD: ${{ secrets.MRIOS_KEYSTORE_PASSWORD }}
          MRIOS_KEY_ALIAS: ${{ secrets.MRIOS_KEY_ALIAS }}
          MRIOS_KEY_PASSWORD: ${{ secrets.MRIOS_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PappVersionName="$VERSION_NAME" -PappVersionCode="$VERSION_CODE"

      - name: Verify signature and prepare files
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p "$RUNNER_TEMP/dist"
          APK="$RUNNER_TEMP/dist/MRiOS-Launcher-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          (cd "$RUNNER_TEMP/dist" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/dist"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" ./* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" ./* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MRiOS Launcher $TAG" \
              --generate-notes
          fi
